[package]
name = "librelink-mcp-rs"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "A privacy-conscious Rust MCP server for LibreLinkUp data (early prototype)"
repository = "https://github.com/johnohhh1/librelink-mcp-rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
directories = "6.0.0"
getrandom = "0.4.3"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "rustls"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io", "macros"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
